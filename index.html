  /* ---------- CART ---------- */
  function initCart() {
    const root = document.getElementById("cart-root");
    const s = Store.settings();

    function render() {
      const items = Cart.items();
      if (!items.length) {
        root.innerHTML = `<div class="empty"><p>${t("empty")}</p><p style="margin-top:1rem"><a class="btn" href="#/shop">${t("shop")}</a></p></div>`;
        return;
      }
      const sub = Cart.subtotal();
      root.innerHTML = `
        <div class="cart-layout">
          <div>
            ${items.map(i => {
              const p = Store.product(i.id);
              const unit = p.salePrice != null ? p.salePrice : p.price;
              return `<div class="cart-item">
                <div class="thumb">${p.image ? `<img src="${esc(p.image)}" alt="">` : esc(p.name.charAt(0))}</div>
                <div>
                  <strong>${esc(p.name)}</strong>
                  <div style="color:var(--text-muted);font-size:.9rem">${money(unit)} × ${i.qty}</div>
                  <div class="qty" style="margin-top:.5rem">
                    <button data-q="${esc(p.id)}" data-d="-1" aria-label="Decrease">−</button>
                    <span>${i.qty}</span>
                    <button data-q="${esc(p.id)}" data-d="1" aria-label="Increase">+</button>
                  </div>
                </div>
                <div style="text-align:right">
                  <strong style="color:var(--gold-light)">${money(unit * i.qty)}</strong><br>
                  <button class="btn btn-danger btn-small" style="margin-top:.4rem" data-rm="${esc(p.id)}">✕</button>
                </div>
              </div>`;
            }).join("")}
          </div>
          <aside class="summary" aria-label="Order summary">
            <h3 style="color:var(--gold-light)">${t("cartTitle")}</h3>
            <div class="row"><span>${t("subtotal")}</span><span>${money(sub)}</span></div>
            <div class="row"><span>${t("discount")}</span><span id="disc-val">${money(0)}</span></div>
            <div class="row total"><span>${t("total")}</span><span id="total-val">${money(sub)}</span></div>
            <p class="notice" style="font-size:.82rem">${t("paymentNote")}</p>
            <a class="btn" style="width:100%" href="#/checkout">${t("checkout")}</a>
          </aside>
        </div>`;
    }

    root.addEventListener("click", e => {
      const q = e.target.closest("[data-q]");
      if (q) { const it = Cart.items().find(i => i.id === q.dataset.q); Cart.setQty(q.dataset.q, it.qty + Number(q.dataset.d)); render(); }
      const rm = e.target.closest("[data-rm]");
      if (rm) { Cart.remove(rm.dataset.rm); render(); }
    });
    document.addEventListener("cart:changed", render);
    render();
    void s;
  }

  /* ---------- CHECKOUT ---------- */
  function initCheckout() {
    const root = document.getElementById("checkout-root");
    const s = Store.settings();
    const payments = Object.entries(s.payments).filter(([, v]) => v.enabled);

    if (!Cart.items().length) {
      root.innerHTML = `<div class="empty"><p>${t("empty")}</p><a class="btn" href="#/shop">${t("shop")}</a></div>`;
      return;
    }

    const payOpts = payments.length
      ? payments.map(([k, v], i) => `
          <label class="pay-option">
            <input type="radio" name="pay" value="${esc(k)}" ${i === 0 ? "checked" : ""}>
            <div>${esc(v.label)}<small>${k === "manual" ? "Manual: we confirm after receiving proof of payment." : "Test/live mode depends on provider setup."}</small></div>
          </label>`).join("")
      : `<p class="notice">No payment method is enabled yet. Enable one in the Admin → Payments page.</p>`;

    root.innerHTML = `
      <form id="checkout-form" novalidate class="cart-layout" aria-label="${t("checkoutTitle")}">
        <div>
          <div class="form-card" style="margin:0;max-width:none">
            <h2>${t("customerInfo")}</h2>
            <div class="form-group"><label for="c-name">${t("name")}</label><input id="c-name" name="name" autocomplete="name" required><div class="field-error"></div></div>
            <div class="form-group"><label for="c-email">${t("email")}</label><input id="c-email" name="email" type="email" autocomplete="email" required><div class="field-error"></div></div>
            <div class="form-group"><label for="c-phone">${t("contact")} (WhatsApp)</label><input id="c-phone" name="phone" autocomplete="tel"></div>
            <h2 style="margin-top:1.5rem">${t("payMethod")}</h2>
            <div class="pay-options">${payOpts}</div>
            ${payments.length ? `<button class="btn" type="submit" style="width:100%">${t("placeOrder")}</button>` : ""}
          </div>
        </div>
        <aside class="summary">
          <h3 style="color:var(--gold-light)">${t("cartTitle")}</h3>
          ${Cart.items().map(i => { const p = Store.product(i.id); return `<div class="row"><span>${esc(p.name)} × ${i.qty}</span><span>${money((p.salePrice ?? p.price) * i.qty)}</span></div>`; }).join("")}
          <div class="coupon-row">
            <input id="coupon" placeholder="${t("coupon")}" aria-label="${t("coupon")}">
            <button type="button" class="btn btn-outline btn-small" id="apply-coupon">${t("apply")}</button>
          </div>
          <div class="row"><span>${t("discount")}</span><span id="c-disc">${money(0)}</span></div>
          <div class="row total"><span>${t("total")}</span><span id="c-total">${money(Cart.subtotal())}</span></div>
          <p class="notice" style="font-size:.82rem">${t("paymentNote")}</p>
        </aside>
      </form>`;

    let discount = 0;
    let couponCode = "";
    function updateTotals() {
      const sub = Cart.subtotal();
      root.querySelector("#c-disc").textContent = "−" + money(discount);
      root.querySelector("#c-total").textContent = money(Math.max(0, sub - discount));
    }

    root.querySelector("#apply-coupon").addEventListener("click", () => {
      const code = root.querySelector("#coupon").value.trim().toUpperCase();
      const c = Store.db.coupons.find(x => x.code === code && x.enabled && (!x.expires || new Date(x.expires) >= new Date()));
      if (!c) { discount = 0; couponCode = ""; updateTotals(); return toast(t("couponBad"), "error"); }
      discount = c.type === "percent" ? Cart.subtotal() * c.value / 100 : Math.min(c.value, Cart.subtotal());
      couponCode = c.code;
      updateTotals();
      toast(t("couponOk"), "success");
    });

    const form = root.querySelector("#checkout-form");
    form.addEventListener("submit", e => {
      e.preventDefault();
      let ok = true;
      form.querySelectorAll(".field-error").forEach(x => x.textContent = "");
      form.querySelectorAll("input").forEach(x => x.classList.remove("invalid"));
      const name = form.name.value.trim();
      const email = form.email.value.trim();
      if (name.length < 2) { ok = false; form.name.classList.add("invalid"); form.name.nextElementSibling.textContent = t("reqField"); }
      if (!isValidEmail(email)) { ok = false; form.email.classList.add("invalid"); form.email.nextElementSibling.textContent = t("badEmail"); }
      const pay = form.querySelector("input[name=pay]:checked");
      if (!pay) { ok = false; toast(t("payMethod") + " — " + t("reqField"), "error"); }
      if (!ok) return;

      // Build the order. Payment is NEVER marked paid here: only the provider (via webhook) may do that.
      const items = Cart.items().map(i => {
        const p = Store.product(i.id);
        return { productId: p.id, name: p.name, qty: i.qty, unitPrice: p.salePrice ?? p.price };
      });
      const sub = Cart.subtotal();
      const order = {
        id: "ND" + Date.now().toString(36).toUpperCase().slice(-6),
        date: new Date().toISOString(),
        customer: { name, email, phone: form.phone.value.trim() },
        items,
        subtotal: sub,
        coupon: couponCode,
        discount: Math.min(discount, sub),
        total: Math.max(0, sub - discount),
        currency: Store.settings().currency,
        paymentMethod: pay.value,
        paymentStatus: "unconfirmed",   // unconfirmed | paid | refunded | failed
        orderStatus: "new",             // new | processing | completed | cancelled
        deliveryStatus: "awaiting payment",
        deliveryNote: "",
        refundNote: ""
      };
      Store.db.orders.push(order);
      // Decrease stock for physical/limited items
      items.forEach(it => {
        const p = Store.product(it.productId);
        if (p && p.stock != null) p.stock = Math.max(0, p.stock - it.qty);
      });
      Store.save();
      Cart.clear();
      root.innerHTML = `
        <div class="form-card" style="text-align:center">
          <h2>Order ${esc(order.id)}</h2>
          <p class="notice">${t("orderPlaced")}</p>
          <p style="color:var(--text-muted)">${t("trackOrder")}: <strong>${esc(order.id)}</strong> + ${esc(order.customer.email)}</p>
          <p style="margin-top:1rem"><a class="btn" href="#/home/track">${t("trackOrder")}</a></p>
        </div>`;
    });
  }

  /* ---------- Router (hash links: works on Android, no separate files) ---------- */
  const TITLES = {
    home: () => Store.settings().seo.title,
    shop: () => t("shop") + " — " + Store.settings().storeName,
    product: () => "Product — " + Store.settings().storeName,
    cart: () => t("cartTitle") + " — " + Store.settings().storeName,
    checkout: () => t("checkoutTitle") + " — " + Store.settings().storeName,
    policies: () => t("privacy") + " — " + Store.settings().storeName,
    admin: () => "Admin — " + Store.settings().storeName
  };
  const INIT = {
    home: (params, sub) => { initHome(); if (sub) scrollToId(sub); },
    shop: () => initShop(),
    product: (params) => initProduct(params),
    cart: () => initCart(),
    checkout: () => initCheckout(),
    policies: (params, sub) => { if (sub) scrollToId(sub); },
    admin: (params, sub) => window.NajemAdmin.init(sub || "overview")
  };

  function scrollToId(id) {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function parseHash() {
    const raw = location.hash.replace(/^#\/?/, "");
    const [path, query] = raw.split("?");
    const parts = (path || "").split("/").filter(Boolean);
    return { name: parts[0] || "home", sub: parts[1] || "", params: new URLSearchParams(query || "") };
  }

  function render() {
    // Ordinary #anchors (like the skip link) are left to the browser
    if (location.hash && !location.hash.startsWith("#/") && location.hash !== "#") return;
    const { name, sub, params } = parseHash();
    const view = document.getElementById("view");
    if (!view) return;
    const tpl = document.getElementById("tpl-" + name);
    const route = tpl ? name : "notfound";
    view.innerHTML = "";
    if (route === "notfound") view.appendChild(document.getElementById("tpl-notfound").content.cloneNode(true));
    else view.appendChild(document.getElementById("tpl-" + route).content.cloneNode(true));
    document.body.classList.toggle("admin-route", route === "admin");
    document.title = (TITLES[route] ? TITLES[route]() : Store.settings().storeName);
    window.NajemCore.renderLayout();
    if (INIT[route]) INIT[route](params, sub);
    if (route !== "home" || !sub) window.scrollTo(0, 0);
    const main = document.getElementById("main");
    if (main) main.focus({ preventScroll: true });
    document.getElementById("main")?.setAttribute("tabindex", "-1");
  }

  window.addEventListener("hashchange", render);
  document.addEventListener("DOMContentLoaded", () => {
    if (!location.hash) location.hash = "#/";   // setting the hash triggers render()
    else render();
  });

  window.NajemPages = { productCard, priceHtml, imageHtml, isValidEmail };
})();

</script>
  <script>
/* =========================================================
   NAJEM DIGITAL — admin dashboard
   SECURITY NOTE: this demo gate runs in the browser. It keeps casual
   visitors out but is NOT real server-side security. Before going live,
   switch to Supabase Auth + Row Level Security (see README.md).
   The password is never stored in plain text: it is salted and hashed
   with PBKDF2-SHA256 (Web Crypto).
   ========================================================= */
(function () {
  const { toast, escapeHtml: h, uid, money, saveDB } = window.NajemCore;
  const Store = window.NajemStore;
  const AUTH_KEY = "najem-admin-auth";
  const SESSION_KEY = "najem-admin-session";
  const SESSION_MS = 30 * 60 * 1000; // auto-logout after 30 min of inactivity
  const ITER = 210000;

  /* ---------- Password hashing (PBKDF2) ---------- */
  const enc = new TextEncoder();
  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function derive(password, salt, iter) {
    const key = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt, iterations: iter }, key, 256);
    return b64(bits);
  }
  async function makeCredential(user, password) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    return { user, salt: b64(salt), iter: ITER, hash: await derive(password, salt, ITER) };
  }
  async function checkPassword(cred, password) {
    const hash = await derive(password, unb64(cred.salt), cred.iter);
    // constant-ish comparison
    if (hash.length !== cred.hash.length) return false;
    let diff = 0;
    for (let i = 0; i < hash.length; i++) diff |= hash.charCodeAt(i) ^ cred.hash.charCodeAt(i);
    return diff === 0;
  }

  const getCred = () => { try { return JSON.parse(localStorage.getItem(AUTH_KEY)); } catch (e) { return null; } };
  const hasSession = () => {
    const s = Number(sessionStorage.getItem(SESSION_KEY));
    return s && Date.now() - s < SESSION_MS;
  };
  const touchSession = () => sessionStorage.setItem(SESSION_KEY, String(Date.now()));

  /* ---------- Login screen ---------- */
  function showLogin() {
    document.getElementById("app").hidden = true;
    const wrap = document.getElementById("login-screen");
    wrap.hidden = false;
    const cred = getCred();
    const setup = !cred;
    document.getElementById("confirm-group").hidden = !setup;
    document.getElementById("a-pass2").required = setup;
    document.getElementById("login-btn").textContent = setup ? "Create admin account" : "Sign in";
    document.getElementById("login-mode").textContent = setup
      ? "First run: create the admin account. Use at least 10 characters. This demo stores a salted hash in this browser only."
      : "Enter your admin username and password.";
  }

  function bindLogin() {
  document.getElementById("login-form").addEventListener("submit", async e => {
    e.preventDefault();
    const user = document.getElementById("a-user").value.trim();
    const pass = document.getElementById("a-pass").value;
    const pass2 = document.getElementById("a-pass2").value;
    const err = document.getElementById("login-error");
    err.textContent = "";
    const cred = getCred();

    if (!user || pass.length < 10) { err.textContent = "Username required and password must be 10+ characters."; return; }

    if (!cred) {
      if (pass !== pass2) { err.textContent = "Passwords do not match."; return; }
      localStorage.setItem(AUTH_KEY, JSON.stringify(await makeCredential(user, pass)));
      touchSession();
      toast("Admin account created.", "success");
      return boot();
    }
    const ok = user === cred.user && await checkPassword(cred, pass);
    if (!ok) { err.textContent = "Invalid username or password."; return; }
    touchSession();
    boot();
  });

  document.getElementById("logout-btn").addEventListener("click", () => {
    sessionStorage.removeItem(SESSION_KEY);
    showLogin();
  });
  }

  const adminOpen = () => { const a = document.getElementById("app"); return !!a && !a.hidden; };
  ["click", "keydown", "mousemove"].forEach(ev => document.addEventListener(ev, () => {
    if (adminOpen()) touchSession();
  }, { passive: true }));
  setInterval(() => {
    if (adminOpen() && !hasSession()) { toast("Session expired — please sign in again.", "error"); document.getElementById("logout-btn").click(); }
  }, 30000);

  /* ---------- Routing (sub-pages come from the site router in pages.js) ---------- */
  const main = () => document.getElementById("admin-main");
  const PAGES = {
    overview: renderOverview, products: renderProducts, categories: renderCategories,
    orders: renderOrders, customers: renderCustomers, reviews: renderReviews, inbox: renderInbox,
    coupons: renderCoupons, seo: renderSeo, payments: renderPayments, settings: renderSettings
  };
  let activeSub = "overview";

  function boot() {
    if (!hasSession()) return showLogin();
    document.getElementById("login-screen").hidden = true;
    document.getElementById("app").hidden = false;
    route();
  }

  function route() {
    const r = PAGES[activeSub] ? activeSub : "overview";
    document.querySelectorAll("[data-page-link]").forEach(a => {
      const on = a.dataset.pageLink === r;
      a.classList.toggle("active", on);
      if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    PAGES[r]();
    main().focus({ preventScroll: true });
  }

  const head = (title, actions = "") => `<div class="admin-head"><h1>${title}</h1><div>${actions}</div></div>`;
  const fmtDate = s => { try { return new Date(s).toLocaleString(); } catch (e) { return s; } };
  const pillFor = status => {
    const cls = { paid: "ok", completed: "ok", approved: "ok", unconfirmed: "warn", new: "warn", pending: "warn", processing: "warn", refunded: "bad", failed: "bad", cancelled: "bad", rejected: "bad" }[status] || "";
    return `<span class="pill ${cls}">${h(status)}</span>`;
  };
  const catName = id => (Store.category(id) || { name: "—" }).name;

  /* ---------- OVERVIEW ---------- */
  function renderOverview() {
    const db = Store.db;
    const orders = db.orders;
    const paid = orders.filter(o => o.paymentStatus === "paid");
    const revenue = paid.reduce((s, o) => s + o.total, 0);
    const unconfirmed = orders.filter(o => o.paymentStatus === "unconfirmed").length;
    const pendingReviews = db.reviews.filter(r => r.status === "pending").length;

    // Orders per day, last 7 days
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i);
      const next = new Date(d); next.setDate(d.getDate() + 1);
      const count = orders.filter(o => { const t = new Date(o.date); return t >= d && t < next; }).length;
      days.push({ label: d.toLocaleDateString(undefined, { weekday: "short" }), count });
    }
    const max = Math.max(1, ...days.map(d => d.count));
    const best = db.products.slice().sort((a, b) => b.sales - a.sales).slice(0, 5);
    const recent = orders.slice().reverse().slice(0, 6);

    main().innerHTML = `
      ${head("Overview")}
      <div class="warn-box">Demo mode: data is saved in this browser only. Revenue counts only orders marked <b>paid</b>. Orders are never marked paid automatically.</div>
      <div class="stats">
        <div class="stat"><div class="label">Total orders</div><div class="value">${orders.length}</div></div>
        <div class="stat"><div class="label">Confirmed revenue</div><div class="value">${money(revenue)}</div></div>
        <div class="stat"><div class="label">Awaiting payment confirmation</div><div class="value">${unconfirmed}</div></div>
        <div class="stat"><div class="label">Total products</div><div class="value">${db.products.length}</div></div>
        <div class="stat"><div class="label">Pending reviews</div><div class="value">${pendingReviews}</div></div>
        <div class="stat"><div class="label">Newsletter subscribers</div><div class="value">${(db.subscribers || []).length}</div></div>
      </div>
      <div class="two-col">
        <div class="panel">
          <h2>Sales statistics — orders, last 7 days</h2>
          <div class="chart" role="img" aria-label="Orders per day">
            ${days.map(d => `<div class="col"><i style="height:${(d.count / max) * 100}%"></i>${d.count}<br>${h(d.label)}</div>`).join("")}
          </div>
        </div>
        <div class="panel">
          <h2>Best-selling products</h2>
          ${best.map(p => `<div style="margin-bottom:.7rem"><div style="display:flex;justify-content:space-between"><span>${h(p.name)}</span><span class="muted">${p.sales} sold</span></div><div class="bar"><span style="width:${Math.min(100, (p.sales / Math.max(1, best[0].sales)) * 100)}%"></span></div></div>`).join("")}
        </div>
      </div>
      <div class="panel">
        <h2>Recent orders</h2>
        ${recent.length ? orderTable(recent) : `<p class="muted">No orders yet.</p>`}
      </div>`;
  }

  function orderTable(list) {
    return `<div class="table-wrap"><table>
      <thead><tr><th>Order</th><th>Date</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th></th></tr></thead>
      <tbody>${list.map(o => `<tr>
        <td><strong>${h(o.id)}</strong></td><td>${h(fmtDate(o.date))}</td>
        <td>${h(o.customer.name)}<br><span class="muted">${h(o.customer.email)}</span></td>
        <td>${money(o.total)}</td><td>${pillFor(o.paymentStatus)}<br><span class="muted">${h(o.paymentMethod)}</span></td>
        <td>${pillFor(o.orderStatus)}<br><span class="muted">${h(o.deliveryStatus)}</span></td>
        <td><button class="btn btn-small btn-outline" data-order="${h(o.id)}">Details</button></td>
      </tr>`).join("")}</tbody></table></div>`;
  }

  /* ---------- PRODUCTS ---------- */
  let editingImage = null; // data URL chosen in editor

  function renderProducts(editId, mode) {
    const list = Store.products();
    const editing = editId ? Store.product(editId) : null;
    main().innerHTML = `
      ${head("Products", `<button class="btn btn-small" id="new-product">+ Add product</button>`)}
      <div id="product-editor"></div>
      <div class="toolbar-row">
        <input type="search" id="p-search" placeholder="Search products…" aria-label="Search products">
        <select id="p-cat-filter" aria-label="Filter by category"><option value="">All categories</option>${Store.categories().map(c => `<option value="${h(c.id)}">${h(c.name)}</option>`).join("")}</select>
      </div>
      <div class="table-wrap"><table id="p-table">
        <thead><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Featured</th><th>Sold</th><th></th></tr></thead>
        <tbody></tbody></table></div>`;

    const draw = () => {
      const q = document.getElementById("p-search").value.trim().toLowerCase();
      const c = document.getElementById("p-cat-filter").value;
      const rows = list.filter(p => (!c || p.categoryId === c) && (!q || p.name.toLowerCase().includes(q)));
      document.querySelector("#p-table tbody").innerHTML = rows.map(p => `<tr>
        <td>${p.image ? `<img class="img-preview" style="width:56px;height:42px;margin:0" src="${h(p.image)}" alt="">` : `<span class="muted">none</span>`}</td>
        <td><strong>${h(p.name)}</strong><br><span class="muted">/${h(p.slug)}</span></td>
        <td>${h(catName(p.categoryId))}</td>
        <td>${p.salePrice != null ? `${money(p.salePrice)}<br><s class="muted">${money(p.price)}</s>` : money(p.price)}</td>
        <td>${p.stock == null ? "∞" : p.stock === 0 ? `<span class="pill bad">0</span>` : p.stock}</td>
        <td>${p.featured ? "★" : "—"}</td><td>${p.sales}</td>
        <td><button class="btn btn-small btn-outline" data-edit-product="${h(p.id)}">Edit</button>
            <button class="btn btn-small btn-danger" data-del-product="${h(p.id)}">Delete</button></td></tr>`).join("")
        || `<tr><td colspan="8" class="muted">No products.</td></tr>`;
    };
    document.getElementById("p-search").addEventListener("input", draw);
    document.getElementById("p-cat-filter").addEventListener("change", draw);
    draw();

    document.getElementById("new-product").onclick = () => openProductEditor(null);
    if (editing || mode === "new") openProductEditor(editing);
  }

  function openProductEditor(p) {
    editingImage = p ? (p.image || null) : null;
    const box = document.getElementById("product-editor");
    const v = p || { id: "", name: "", slug: "", categoryId: Store.categories()[0].id, type: "digital", description: "", price: "", salePrice: "", stock: "", featured: false, tags: [], downloadUrl: "", seoTitle: "", seoDescription: "" };
    box.innerHTML = `
      <form class="editor" id="product-form" novalidate aria-labelledby="pf-title">
        <h2 id="pf-title" style="color:var(--gold-light);margin-bottom:.8rem">${p ? "Edit product" : "New product"}</h2>
        <div class="grid2">
          <div class="form-group"><label for="pf-name">Name *</label><input id="pf-name" name="name" required value="${h(v.name)}"><div class="field-error"></div></div>
          <div class="form-group"><label for="pf-slug">URL slug</label><input id="pf-slug" name="slug" value="${h(v.slug)}" placeholder="auto-from-name"><div class="field-error"></div></div>
          <div class="form-group"><label for="pf-cat">Category *</label><select id="pf-cat" name="categoryId">${Store.categories().map(c => `<option value="${h(c.id)}" ${c.id === v.categoryId ? "selected" : ""}>${h(c.name)}</option>`).join("")}</select></div>
          <div class="form-group"><label for="pf-type">Type</label><select id="pf-type" name="type"><option value="digital" ${v.type === "digital" ? "selected" : ""}>Digital download / access</option><option value="service" ${v.type === "service" ? "selected" : ""}>Service</option></select></div>
          <div class="form-group"><label for="pf-price">Price *</label><input id="pf-price" name="price" type="number" min="0" step="0.01" required value="${v.price}"><div class="field-error"></div></div>
          <div class="form-group"><label for="pf-sale">Discount price (optional)</label><input id="pf-sale" name="salePrice" type="number" min="0" step="0.01" value="${v.salePrice ?? ""}"><div class="field-error"></div></div>
          <div class="form-group"><label for="pf-stock">Stock (leave empty = unlimited, 0 = out of stock)</label><input id="pf-stock" name="stock" type="number" min="0" step="1" value="${v.stock ?? ""}"></div>
          <div class="form-group"><label for="pf-tags">Tags (comma separated)</label><input id="pf-tags" name="tags" value="${h((v.tags || []).join(", "))}"></div>
        </div>
        <div class="form-group"><label for="pf-desc">Description *</label><textarea id="pf-desc" name="description" required>${h(v.description)}</textarea><div class="field-error"></div></div>
        <div class="grid2">
          <div class="form-group"><label for="pf-img">Product image (max 300 KB, jpg/png/webp)</label><input id="pf-img" type="file" accept="image/*"><img id="pf-preview" class="img-preview" alt="${editingImage ? "Current product image" : ""}" ${editingImage ? `src="${h(editingImage)}"` : "hidden"}></div>
          <div class="form-group"><label for="pf-dl">Downloadable file link (PRIVATE — sent only after payment is confirmed)</label><input id="pf-dl" name="downloadUrl" type="url" value="${h(v.downloadUrl || "")}" placeholder="https://…"><span class="muted">Never shown publicly. Use a private link from your storage provider.</span></div>
        </div>
        <div class="grid2">
          <div class="form-group"><label for="pf-seo-t">SEO title</label><input id="pf-seo-t" name="seoTitle" value="${h(v.seoTitle || "")}"></div>
          <div class="form-group"><label for="pf-seo-d">SEO meta description</label><input id="pf-seo-d" name="seoDescription" value="${h(v.seoDescription || "")}"></div>
        </div>
        <label class="check"><input type="checkbox" name="featured" ${v.featured ? "checked" : ""}> Mark as featured</label>
        <div class="actions-row">
          <button class="btn" type="submit">Save product</button>
          <button class="btn btn-outline" type="button" id="pf-cancel">Cancel</button>
        </div>
      </form>`;
    box.scrollIntoView({ behavior: "smooth", block: "start" });

    const form = document.getElementById("product-form");
    form.name.addEventListener("input", () => { if (!p && !form.slug.value) form.slug.placeholder = slugify(form.name.value); });
    document.getElementById("pf-img").addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 300 * 1024) { toast("Image is larger than 300 KB. Please compress it first.", "error"); e.target.value = ""; return; }
      const r = new FileReader();
      r.onload = () => { editingImage = r.result; const pv = document.getElementById("pf-preview"); pv.src = r.result; pv.hidden = false; };
      r.readAsDataURL(file);
    });
    document.getElementById("pf-cancel").onclick = () => { box.innerHTML = ""; };

    form.addEventListener("submit", e => {
      e.preventDefault();
      form.querySelectorAll(".field-error").forEach(x => x.textContent = "");
      form.querySelectorAll("input,textarea,select").forEach(x => x.classList.remove("invalid"));
      const errs = [];
      const fail = (el, msg) => { el.classList.add("invalid"); el.closest(".form-group").querySelector(".field-error").textContent = msg; errs.push(msg); };

      const name = form.name.value.trim();
      const price = parseFloat(form.price.value);
      const sale = form.salePrice.value === "" ? null : parseFloat(form.salePrice.value);
      const stock = form.stock.value === "" ? null : parseInt(form.stock.value, 10);
      if (name.length < 2) fail(form.name, t("reqField"));
      if (!form.description.value.trim()) fail(form.description, t("reqField"));
      if (isNaN(price) || price < 0) fail(form.price, "Enter a valid price.");
      if (sale != null && (isNaN(sale) || sale < 0 || sale >= price)) fail(form.salePrice, "Discount must be lower than the price.");
      if (stock != null && (isNaN(stock) || stock < 0)) fail(form.stock, "Stock must be 0 or more.");
      if (form.downloadUrl.value && !/^https:\/\//.test(form.downloadUrl.value)) fail(form.downloadUrl, "Use an https:// link.");
      if (errs.length) return toast("Please fix the highlighted fields.", "error");

      const slug = slugify(form.slug.value || name);
      const clash = Store.products().find(x => x.slug === slug && x.id !== v.id);
      if (clash) return fail(form.slug, "This slug is already used.");

      const data = {
        name, slug, categoryId: form.categoryId.value, type: form.type.value,
        description: form.description.value.trim(), price, salePrice: sale, stock,
        featured: form.featured.checked, image: editingImage || "",
        tags: form.tags.value.split(",").map(s => s.trim()).filter(Boolean),
        downloadUrl: form.downloadUrl.value.trim(), seoTitle: form.seoTitle.value.trim(), seoDescription: form.seoDescription.value.trim()
      };
      if (p) {
        Object.assign(Store.product(p.id), data);
      } else {
        Store.db.products.push({ id: uid("p"), sales: 0, ...data });
      }
      if (saveDB()) { toast("Product saved.", "success"); renderProducts(); }
    });
  }

  function slugify(s) { return String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "product"; }
  function t(k) { return window.NajemCore.t(k); }

  /* ---------- CATEGORIES ---------- */
  function renderCategories() {
    main().innerHTML = `
      ${head("Categories")}
      <div class="panel">
        <form id="cat-form" class="toolbar-row" novalidate>
          <input name="name" placeholder="Category name" aria-label="Category name" required minlength="2" style="min-width:260px">
          <button class="btn btn-small" type="submit">Add category</button>
        </form>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Name</th><th>Slug</th><th>Products</th><th></th></tr></thead><tbody>
        ${Store.categories().map(c => `<tr>
          <td><input value="${h(c.name)}" data-cat-name="${h(c.id)}" aria-label="Name" style="width:auto;min-width:220px"></td>
          <td class="muted">${h(c.slug)}</td>
          <td>${Store.products().filter(p => p.categoryId === c.id).length}</td>
          <td><button class="btn btn-small btn-outline" data-save-cat="${h(c.id)}">Save</button>
              <button class="btn btn-small btn-danger" data-del-cat="${h(c.id)}">Delete</button></td></tr>`).join("")}
      </tbody></table></div>`;

    document.getElementById("cat-form").addEventListener("submit", e => {
      e.preventDefault();
      const name = e.target.name.value.trim();
      if (name.length < 2) return toast(t("reqField"), "error");
      Store.db.categories.push({ id: uid("cat"), name, slug: slugify(name) });
      saveDB(); toast("Category added.", "success"); renderCategories();
    });
  }

  /* ---------- ORDERS ---------- */
  function renderOrders() {
    main().innerHTML = `
      ${head("Orders")}
      <div class="toolbar-row">
        <input type="search" id="o-search" placeholder="Search order, name or email…" aria-label="Search orders">
        <select id="o-status" aria-label="Filter by payment status">
          <option value="">All payment statuses</option>
          ${["unconfirmed", "paid", "failed", "refunded"].map(s => `<option value="${s}">${s}</option>`).join("")}
        </select>
      </div>
      <div id="order-detail"></div>
      <div id="order-table"></div>`;
    const draw = () => {
      const q = document.getElementById("o-search").value.trim().toLowerCase();
      const st = document.getElementById("o-status").value;
      const list = Store.db.orders.filter(o =>
        (!st || o.paymentStatus === st) &&
        (!q || (o.id + " " + o.customer.name + " " + o.customer.email).toLowerCase().includes(q))
      ).slice().reverse();
      document.getElementById("order-table").innerHTML = list.length ? orderTable(list) : `<p class="muted">No orders match.</p>`;
    };
    document.getElementById("o-search").addEventListener("input", draw);
    document.getElementById("o-status").addEventListener("change", draw);
    draw();
  }

  function openOrder(id) {
    const o = Store.db.orders.find(x => x.id === id);
    if (!o) return;
    const box = document.getElementById("order-detail");
    box.innerHTML = `
      <div class="panel" id="order-panel">
        <h2>Order ${h(o.id)} <span class="muted" style="font-size:.9rem">· ${h(fmtDate(o.date))}</span></h2>
        <div class="two-col">
          <div>
            <p><b>${h(o.customer.name)}</b><br>${h(o.customer.email)}<br>${h(o.customer.phone || "")}</p>
            <table style="margin-top:.8rem"><tbody>
              ${o.items.map(i => `<tr><td>${h(i.name)} × ${i.qty}</td><td style="text-align:right">${money(i.unitPrice * i.qty)}</td></tr>`).join("")}
              ${o.discount ? `<tr><td>Coupon ${h(o.coupon)}</td><td style="text-align:right">−${money(o.discount)}</td></tr>` : ""}
              <tr><th>Total</th><th style="text-align:right">${money(o.total)}</th></tr>
            </tbody></table>
          </div>
          <div>
            <div class="form-group"><label for="od-pay">Payment status</label>
              <select id="od-pay">${["unconfirmed", "paid", "failed", "refunded"].map(s => `<option ${o.paymentStatus === s ? "selected" : ""}>${s}</option>`).join("")}</select></div>
            <div class="form-group"><label for="od-order">Order status</label>
              <select id="od-order">${["new", "processing", "completed", "cancelled"].map(s => `<option ${o.orderStatus === s ? "selected" : ""}>${s}</option>`).join("")}</select></div>
            <div class="form-group"><label for="od-deliv">Delivery status</label>
              <select id="od-deliv">${["awaiting payment", "preparing", "sent by email", "delivered", "shipped", "returned"].map(s => `<option ${o.deliveryStatus === s ? "selected" : ""}>${s}</option>`).join("")}</select></div>
            <div class="form-group"><label for="od-note">Delivery note (shown to customer when they track)</label><input id="od-note" value="${h(o.deliveryNote || "")}"></div>
            <div class="form-group"><label for="od-refund">Refund note (internal — refunds are done in your payment provider)</label><input id="od-refund" value="${h(o.refundNote || "")}"></div>
            <p class="muted">Method: ${h(o.paymentMethod)}</p>
            <div class="actions-row">
              <button class="btn btn-small" id="od-save">Save order</button>
              <button class="btn btn-small btn-outline" id="od-close">Close</button>
            </div>
          </div>
        </div>
      </div>`;
    box.scrollIntoView({ behavior: "smooth" });
    document.getElementById("od-close").onclick = () => { box.innerHTML = ""; };
    document.getElementById("od-save").onclick = () => {
      o.paymentStatus = document.getElementById("od-pay").value;
      o.orderStatus = document.getElementById("od-order").value;
      o.deliveryStatus = document.getElementById("od-deliv").value;
      o.deliveryNote = document.getElementById("od-note").value.trim();
      o.refundNote = document.getElementById("od-refund").value.trim();
      if (o.paymentStatus === "refunded" && !o.refundNote) return toast("Add a refund note (e.g. provider refund reference).", "error");
      if (saveDB()) { toast("Order updated.", "success"); renderOrders(); }
    };
  }

  /* ---------- CUSTOMERS ---------- */
  function renderCustomers() {
    const map = {};
    Store.db.orders.forEach(o => {
      const k = o.customer.email.toLowerCase();
      map[k] = map[k] || { name: o.customer.name, email: o.customer.email, phone: o.customer.phone, orders: 0, spent: 0 };
      map[k].orders++;
      if (o.paymentStatus === "paid") map[k].spent += o.total;
    });
    const all = Object.values(map);
    main().innerHTML = `
      ${head("Customers")}
      <div class="toolbar-row"><input type="search" id="cu-search" placeholder="Search name or email…" aria-label="Search customers"></div>
      <div id="cu-table"></div>
      <p class="muted">Customer data is visible only inside this admin area and is never shown on the public site.</p>`;
    const draw = () => {
      const q = document.getElementById("cu-search").value.trim().toLowerCase();
      const rows = all.filter(c => (c.name + c.email).toLowerCase().includes(q));
      document.getElementById("cu-table").innerHTML = rows.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Orders</th><th>Confirmed spend</th></tr></thead>
        <tbody>${rows.map(c => `<tr><td>${h(c.name)}</td><td>${h(c.email)}</td><td>${h(c.phone || "—")}</td><td>${c.orders}</td><td>${money(c.spent)}</td></tr>`).join("")}</tbody></table></div>`
        : `<p class="muted">No customers yet.</p>`;
    };
    document.getElementById("cu-search").addEventListener("input", draw);
    draw();
  }

  /* ---------- REVIEWS ---------- */
  function renderReviews() {
    main().innerHTML = `
      ${head("Reviews")}
      <p class="muted" style="margin-bottom:1rem">Only <b>approved</b> reviews appear on the public store.</p>
      <div class="table-wrap"><table><thead><tr><th>Name</th><th>Rating</th><th>Review</th><th>Status</th><th>Date</th><th></th></tr></thead><tbody>
      ${Store.db.reviews.map(r => `<tr>
        <td>${h(r.name)}</td><td>${"★".repeat(r.rating)}</td><td style="max-width:360px">${h(r.text)}</td>
        <td>${pillFor(r.status)}</td><td>${h(r.date)}</td>
        <td>
          <button class="btn btn-small" data-rev="approved" data-id="${h(r.id)}">Approve</button>
          <button class="btn btn-small btn-outline" data-rev="rejected" data-id="${h(r.id)}">Reject</button>
          <button class="btn btn-small btn-danger" data-rev="delete" data-id="${h(r.id)}">Delete</button>
        </td></tr>`).join("") || `<tr><td colspan="6" class="muted">No reviews.</td></tr>`}
      </tbody></table></div>`;
  }

  /* ---------- INBOX ---------- */
  function renderInbox() {
    const msgs = (Store.db.messages || []).slice().reverse();
    main().innerHTML = `
      ${head("Messages (contact form)")}
      ${msgs.length ? msgs.map(m => `<div class="panel">
        <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem"><b>${h(m.name)}</b><span class="muted">${h(fmtDate(m.date))}</span></div>
        <p class="muted">${h(m.email)}</p><p style="margin:.6rem 0">${h(m.message)}</p>
        <div class="actions-row"><a class="btn btn-small" href="mailto:${h(m.email)}">Reply by email</a>
        <button class="btn btn-small btn-danger" data-msg="${h(m.id)}">Delete</button></div></div>`).join("")
        : `<p class="muted">No messages yet.</p>`}
      <div class="panel"><h2>Newsletter subscribers (${(Store.db.subscribers || []).length})</h2>
        <p class="muted">${(Store.db.subscribers || []).map(h).join(", ") || "None yet."}</p></div>`;
  }

  /* ---------- COUPONS ---------- */
  function renderCoupons() {
    main().innerHTML = `
      ${head("Coupons")}
      <div class="panel"><h2>Create coupon</h2>
        <form id="cp-form" class="toolbar-row" novalidate>
          <input name="code" placeholder="CODE (A-Z, 0-9)" aria-label="Code" required pattern="[A-Za-z0-9_-]{3,20}" style="min-width:180px">
          <select name="type" aria-label="Type"><option value="percent">% off</option><option value="fixed">Fixed amount</option></select>
          <input name="value" type="number" min="0.01" step="0.01" placeholder="Value" aria-label="Value" required style="min-width:120px">
          <input name="expires" type="date" aria-label="Expiry date">
          <button class="btn btn-small" type="submit">Create</button>
        </form>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Code</th><th>Discount</th><th>Expires</th><th>Status</th><th></th></tr></thead><tbody>
      ${Store.db.coupons.map(c => `<tr><td><b>${h(c.code)}</b></td>
        <td>${c.type === "percent" ? c.value + "%" : money(c.value)}</td><td>${h(c.expires || "never")}</td>
        <td>${c.enabled ? `<span class="pill ok">enabled</span>` : `<span class="pill">disabled</span>`}</td>
        <td><button class="btn btn-small btn-outline" data-cp-toggle="${h(c.id)}">${c.enabled ? "Disable" : "Enable"}</button>
            <button class="btn btn-small btn-danger" data-cp-del="${h(c.id)}">Delete</button></td></tr>`).join("") || `<tr><td colspan="5" class="muted">No coupons.</td></tr>`}
      </tbody></table></div>`;

    document.getElementById("cp-form").addEventListener("submit", e => {
      e.preventDefault();
      const f = e.target;
      const code = f.code.value.trim().toUpperCase();
      const value = parseFloat(f.value.value);
      if (!/^[A-Z0-9_-]{3,20}$/.test(code)) return toast("Code must be 3–20 letters/numbers.", "error");
      if (isNaN(value) || value <= 0) return toast("Enter a valid value.", "error");
      if (f.type.value === "percent" && value > 100) return toast("Percent cannot exceed 100.", "error");
      if (Store.db.coupons.find(c => c.code === code)) return toast("This code already exists.", "error");
      Store.db.coupons.push({ id: uid("c"), code, type: f.type.value, value, expires: f.expires.value || "", enabled: true });
      saveDB(); toast("Coupon created.", "success"); renderCoupons();
    });
  }

  /* ---------- SEO ---------- */
  function renderSeo() {
    const s = Store.settings().seo;
    main().innerHTML = `
      ${head("SEO")}
      <div class="panel"><h2>Homepage SEO</h2>
        <form id="seo-form" novalidate>
          <div class="form-group"><label for="se-title">Page title (50–60 characters recommended)</label><input id="se-title" value="${h(s.title)}" maxlength="120"></div>
          <div class="form-group"><label for="se-desc">Meta description (120–160 characters recommended)</label><textarea id="se-desc" maxlength="320">${h(s.description)}</textarea></div>
          <div class="form-group"><label for="se-url">Site URL (https://your-domain)</label><input id="se-url" type="url" value="${h(s.url)}"></div>
          <div class="form-group"><label for="se-og">Open Graph image URL</label><input id="se-og" value="${h(s.ogImage)}"></div>
          <button class="btn" type="submit">Save SEO</button>
        </form>
      </div>
      <div class="panel"><h2>Product SEO</h2>
        <div class="table-wrap"><table><thead><tr><th>Product</th><th>URL slug</th><th>SEO title</th><th></th></tr></thead><tbody>
        ${Store.products().map(p => `<tr><td>${h(p.name)}</td><td><input value="${h(p.slug)}" data-slug="${h(p.id)}" aria-label="Slug" style="min-width:180px"></td>
          <td><input value="${h(p.seoTitle || "")}" data-ptitle="${h(p.id)}" aria-label="SEO title" style="min-width:220px"></td>
          <td><button class="btn btn-small btn-outline" data-save-seo="${h(p.id)}">Save</button></td></tr>`).join("")}
        </tbody></table></div>
        <p class="muted" style="margin-top:.6rem">Tip: use the product editor to edit meta descriptions and image alt text.</p>
      </div>`;

    document.getElementById("seo-form").addEventListener("submit", e => {
      e.preventDefault();
      const seo = Store.settings().seo;
      seo.title = document.getElementById("se-title").value.trim();
      seo.description = document.getElementById("se-desc").value.trim();
      seo.url = document.getElementById("se-url").value.trim();
      seo.ogImage = document.getElementById("se-og").value.trim();
      if (saveDB()) toast("SEO saved.", "success");
    });
  }

  /* ---------- PAYMENTS ---------- */
  function renderPayments() {
    const pay = Store.settings().payments;
    main().innerHTML = `
      ${head("Payments")}
      <div class="warn-box"><b>Important:</b> Card (Stripe) and PayPal require server-side code and your provider accounts. Their secret keys must never be typed into this page or stored in the browser. Until they are connected, keep them disabled. A payment is shown as <b>paid</b> only when the provider confirms it (webhook), never because a customer clicked a button.</div>
      <div class="panel">
        ${Object.entries(pay).map(([k, v]) => `
          <div class="form-group" style="border-bottom:1px solid #222;padding-bottom:1rem">
            <label class="check" style="font-size:1rem;color:var(--text)"><input type="checkbox" data-pay-on="${k}" ${v.enabled ? "checked" : ""}> Enabled — <b>${h(k)}</b></label>
            <label for="pl-${k}">Label shown to customers</label>
            <input id="pl-${k}" data-pay-label="${k}" value="${h(v.label)}">
          </div>`).join("")}
        <button class="btn" id="pay-save">Save payment settings</button>
      </div>`;
    document.getElementById("pay-save").onclick = () => {
      document.querySelectorAll("[data-pay-on]").forEach(cb => { Store.settings().payments[cb.dataset.payOn].enabled = cb.checked; });
      document.querySelectorAll("[data-pay-label]").forEach(inp => { Store.settings().payments[inp.dataset.payLabel].label = inp.value.trim(); });
      if (saveDB()) toast("Payment settings saved.", "success");
    };
  }

  /* ---------- SETTINGS ---------- */
  function renderSettings() {
    const s = Store.settings();
    main().innerHTML = `
      ${head("Store settings")}
      <form class="panel" id="set-form" novalidate>
        <div class="two-col">
          <div>
            <div class="form-group"><label for="st-name">Store name</label><input id="st-name" value="${h(s.storeName)}" required></div>
            <div class="form-group"><label for="st-owner">Owner name</label><input id="st-owner" value="${h(s.ownerName)}"></div>
            <div class="form-group"><label for="st-email">Contact email</label><input id="st-email" type="email" value="${h(s.email)}" required></div>
            <div class="form-group"><label for="st-phone">Phone</label><input id="st-phone" value="${h(s.phone)}"></div>
            <div class="form-group"><label for="st-wa">WhatsApp number (digits, with country code, e.g. 212600000000)</label><input id="st-wa" value="${h(s.whatsapp)}" inputmode="numeric"></div>
            <div class="form-group"><label for="st-addr">Business address</label><input id="st-addr" value="${h(s.address)}"></div>
          </div>
          <div>
            <div class="form-group"><label for="st-cur">Currency (display only — does not convert or transfer money)</label>
              <select id="st-cur">${["EUR", "USD", "MAD"].map(c => `<option ${s.currency === c ? "selected" : ""}>${c}</option>`).join("")}</select></div>
            <div class="form-group"><label for="st-lang">Default language</label>
              <select id="st-lang"><option value="en" ${s.defaultLang === "en" ? "selected" : ""}>English</option><option value="fr" ${s.defaultLang === "fr" ? "selected" : ""}>Français</option></select></div>
            <div class="form-group"><label for="st-deliv">Digital delivery / shipping note (shown on product pages)</label><textarea id="st-deliv">${h(s.deliveryNote)}</textarea></div>
            <div class="form-group"><label for="st-ig">Instagram URL</label><input id="st-ig" type="url" value="${h(s.social.instagram)}"></div>
            <div class="form-group"><label for="st-tt">TikTok URL</label><input id="st-tt" type="url" value="${h(s.social.tiktok)}"></div>
            <div class="form-group"><label for="st-fb">Facebook URL</label><input id="st-fb" type="url" value="${h(s.social.facebook)}"></div>
            <div class="form-group"><label for="st-x">X / Twitter URL</label><input id="st-x" type="url" value="${h(s.social.x)}"></div>
          </div>
        </div>
        <div class="actions-row"><button class="btn" type="submit">Save settings</button></div>
      </form>
      <div class="panel">
        <h2>Backup & demo data</h2>
        <p class="muted">Export a backup file of everything in this browser. Demo data can be reset here.</p>
        <div class="actions-row">
          <button class="btn btn-small" id="exp-btn">Export backup (JSON)</button>
          <button class="btn btn-small btn-danger" id="reset-btn">Reset to demo data</button>
        </div>
      </div>`;

    document.getElementById("set-form").addEventListener("submit", e => {
      e.preventDefault();
      const email = document.getElementById("st-email").value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast("Enter a valid email.", "error");
      Object.assign(s, {
        storeName: document.getElementById("st-name").value.trim() || "NAJEM DIGITAL",
        ownerName: document.getElementById("st-owner").value.trim(),
        email,
        phone: document.getElementById("st-phone").value.trim(),
        whatsapp: document.getElementById("st-wa").value.replace(/\D/g, ""),
        address: document.getElementById("st-addr").value.trim(),
        currency: document.getElementById("st-cur").value,
        defaultLang: document.getElementById("st-lang").value,
        deliveryNote: document.getElementById("st-deliv").value.trim()
      });
      s.social = {
        instagram: document.getElementById("st-ig").value.trim(),
        tiktok: document.getElementById("st-tt").value.trim(),
        facebook: document.getElementById("st-fb").value.trim(),
        x: document.getElementById("st-x").value.trim()
      };
      if (saveDB()) toast("Settings saved.", "success");
    });
    document.getElementById("exp-btn").onclick = () => {
      const blob = new Blob([JSON.stringify(Store.db, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "najem-digital-backup.json";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
    document.getElementById("reset-btn").onclick = () => {
      if (!confirm("Reset ALL data in this browser to demo data? This cannot be undone.")) return;
      Store.reset();
      toast("Demo data restored.", "success");
      renderSettings();
    };
  }

  /* ---------- Event delegation for all admin actions ---------- */
  function attachClicks() {
  main().addEventListener("click", e => {
    const t = e.target;
    const db = Store.db;
    const edit = t.closest("[data-edit-product]");
    if (edit) return openProductEditor(Store.product(edit.dataset.editProduct));
    const del = t.closest("[data-del-product]");
    if (del) {
      const p = Store.product(del.dataset.delProduct);
      if (!p || !confirm(`Delete "${p.name}"? Past orders keep their record.`)) return;
      db.products.splice(db.products.indexOf(p), 1);
      saveDB(); toast("Product deleted.", "success"); renderProducts(); return;
    }
    const ord = t.closest("[data-order]");
    if (ord) return openOrder(ord.dataset.order);
    const sc = t.closest("[data-save-cat]");
    if (sc) {
      const c = Store.category(sc.dataset.saveCat);
      const v = main().querySelector(`[data-cat-name="${c.id}"]`).value.trim();
      if (v.length < 2) return toast("Name is too short.", "error");
      c.name = v; c.slug = slugify(v); saveDB(); toast("Category saved.", "success"); return renderCategories();
    }
    const dc = t.closest("[data-del-cat]");
    if (dc) {
      const used = db.products.filter(p => p.categoryId === dc.dataset.delCat).length;
      if (used) return toast(`Move or delete the ${used} product(s) in this category first.`, "error");
      if (!confirm("Delete this category?")) return;
      db.categories.splice(db.categories.findIndex(c => c.id === dc.dataset.delCat), 1);
      saveDB(); toast("Category deleted.", "success"); return renderCategories();
    }
    const rv = t.closest("[data-rev]");
    if (rv) {
      const r = db.reviews.find(x => x.id === rv.dataset.id);
      if (rv.dataset.rev === "delete") {
        if (!confirm("Delete this review?")) return;
        db.reviews.splice(db.reviews.indexOf(r), 1);
      } else r.status = rv.dataset.rev;
      saveDB(); return renderReviews();
    }
    const msg = t.closest("[data-msg]");
    if (msg) {
      if (!confirm("Delete this message?")) return;
      db.messages = db.messages.filter(m => m.id !== msg.dataset.msg);
      saveDB(); return renderInbox();
    }
    const cpT = t.closest("[data-cp-toggle]");
    if (cpT) { const c = db.coupons.find(x => x.id === cpT.dataset.cpToggle); c.enabled = !c.enabled; saveDB(); return renderCoupons(); }
    const cpD = t.closest("[data-cp-del]");
    if (cpD) { if (!confirm("Delete this coupon?")) return; db.coupons = db.coupons.filter(x => x.id !== cpD.dataset.cpDel); saveDB(); return renderCoupons(); }
    const sv = t.closest("[data-save-seo]");
    if (sv) {
      const id = sv.dataset.saveSeo;
      const p = Store.product(id);
      const slug = slugify(main().querySelector(`[data-slug="${id}"]`).value);
      if (db.products.some(x => x.slug === slug && x.id !== id)) return toast("Slug already used.", "error");
      p.slug = slug;
      p.seoTitle = main().querySelector(`[data-ptitle="${id}"]`).value.trim();
      saveDB(); toast("Product SEO saved.", "success");
    }
  });
  }

  function init(sub) {
    activeSub = sub || "overview";
    bindLogin();
    attachClicks();
    boot();
  }
  window.NajemAdmin = { init, renderProducts, openProductEditor };
})();

</script>
</body>
</html>
