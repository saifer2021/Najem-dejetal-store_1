  <style>
/* NAJEM DIGITAL — Black + Gold theme */
:root {
  --bg: #050505;
  --bg-2: #121212;
  --bg-3: #1c1c1c;
  --gold: #c9a24a;
  --gold-light: #f5dc8a;
  --gold-dark: #8a6a25;
  --text: #ffffff;
  --text-muted: #b8b8b8;
  --border: rgba(201, 162, 74, 0.25);
  --danger: #e05c5c;
  --success: #6fcf8a;
  --radius: 14px;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
  --gold-grad: linear-gradient(135deg, var(--gold-light), var(--gold) 50%, var(--gold-dark));
  --font-head: Georgia, "Times New Roman", serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}
img { max-width: 100%; display: block; }
a { color: var(--gold); text-decoration: none; }
a:hover { color: var(--gold-light); }
h1, h2, h3 { font-family: var(--font-head); line-height: 1.2; }
h1 { font-size: clamp(2rem, 5vw, 3.6rem); }
h2 { font-size: clamp(1.6rem, 3.5vw, 2.4rem); color: var(--gold-light); margin-bottom: 0.5rem; }
h3 { font-size: 1.2rem; }
section { padding: 4rem 1.2rem; }
.container { max-width: 1200px; margin: 0 auto; }
.section-head { text-align: center; margin-bottom: 2.5rem; }
.section-head p { color: var(--text-muted); max-width: 640px; margin: 0.5rem auto 0; }
.gold-text { background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.skip-link { position: absolute; left: -999px; top: 0; background: var(--gold); color: #000; padding: 0.5rem 1rem; z-index: 999; }
.skip-link:focus { left: 1rem; top: 1rem; }

/* Demo banner */
.demo-banner {
  background: var(--bg-3);
  border-bottom: 1px solid var(--border);
  color: var(--gold-light);
  text-align: center;
  font-size: 0.85rem;
  padding: 0.4rem 1rem;
}

/* Buttons */
.btn {
  display: inline-block;
  border: none;
  cursor: pointer;
  font: inherit;
  font-weight: 600;
  padding: 0.8rem 1.5rem;
  border-radius: 999px;
  background: var(--gold-grad);
  color: #111;
  box-shadow: 0 6px 18px rgba(201, 162, 74, 0.25);
  transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
  text-align: center;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(201, 162, 74, 0.4); filter: brightness(1.05); color: #111; }
.btn:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 3px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-outline { background: transparent; color: var(--gold); border: 1px solid var(--gold); box-shadow: none; }
.btn-outline:hover { background: rgba(201, 162, 74, 0.1); color: var(--gold-light); }
.btn-small { padding: 0.4rem 0.9rem; font-size: 0.85rem; }
.btn-danger { background: var(--danger); color: #fff; box-shadow: none; }

/* Header */
.site-header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(5, 5, 5, 0.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.nav-wrap { display: flex; align-items: center; justify-content: space-between; padding: 0.8rem 1.2rem; max-width: 1200px; margin: 0 auto; gap: 1rem; }
.brand { display: flex; align-items: center; gap: 0.6rem; color: var(--text); font-family: var(--font-head); font-weight: 700; letter-spacing: 0.08em; }
.brand img { width: 42px; height: 42px; }
.brand:hover { color: var(--gold-light); }
.nav-links { display: flex; gap: 1.4rem; list-style: none; align-items: center; }
.nav-links a { color: var(--text); font-size: 0.95rem; position: relative; }
.nav-links a::after { content: ""; position: absolute; left: 0; bottom: -4px; width: 0; height: 2px; background: var(--gold); transition: width 0.25s; }
.nav-links a:hover::after, .nav-links a.active::after { width: 100%; }
.nav-actions { display: flex; align-items: center; gap: 0.8rem; }
.cart-btn { position: relative; background: none; border: 1px solid var(--border); color: var(--gold-light); border-radius: 999px; padding: 0.4rem 0.9rem; cursor: pointer; font: inherit; }
.cart-count { position: absolute; top: -8px; right: -8px; background: var(--gold); color: #000; font-size: 0.7rem; font-weight: 700; border-radius: 999px; padding: 1px 6px; }
.menu-toggle { display: none; background: none; border: 1px solid var(--border); color: var(--gold); border-radius: 8px; padding: 0.3rem 0.6rem; font-size: 1.2rem; cursor: pointer; }

@media (max-width: 860px) {
  .menu-toggle { display: block; }
  .nav-links {
    position: fixed; top: 0; right: 0; height: 100vh; width: 260px;
    background: var(--bg-2); flex-direction: column; align-items: flex-start;
    padding: 5rem 2rem; gap: 1.4rem; transform: translateX(100%);
    transition: transform 0.3s ease; box-shadow: var(--shadow);
  }
  .nav-links.open { transform: translateX(0); }
}

/* Hero */
.hero {
  position: relative; overflow: hidden;
  min-height: 86vh; display: flex; align-items: center; justify-content: center;
  text-align: center;
  background:
    radial-gradient(circle at 20% 20%, rgba(201, 162, 74, 0.18), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(201, 162, 74, 0.12), transparent 45%),
    linear-gradient(180deg, #000, #111);
  padding: 4rem 1.2rem;
}
.hero-grid {
  position: absolute; inset: 0; opacity: 0.12; pointer-events: none;
  background-image: linear-gradient(var(--gold) 1px, transparent 1px), linear-gradient(90deg, var(--gold) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(circle, #000 30%, transparent 75%);
}
.hero-content { position: relative; max-width: 780px; animation: fadeUp 0.9s ease both; }
.hero p.lead { color: var(--text-muted); font-size: 1.1rem; margin: 1.2rem auto 2rem; max-width: 620px; }
.hero-buttons { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
.eyebrow { color: var(--gold); letter-spacing: 0.25em; text-transform: uppercase; font-size: 0.8rem; margin-bottom: 1rem; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

/* Cards & grids */
.grid { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.card {
  background: linear-gradient(180deg, var(--bg-3), var(--bg-2));
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  display: flex; flex-direction: column;
  transition: transform 0.25s ease, border-color 0.25s ease;
}
.card:hover { transform: translateY(-4px); border-color: var(--gold); }
.card-img { aspect-ratio: 4 / 3; background: #0d0d0d; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.card-img img { width: 100%; height: 100%; object-fit: cover; }
.card-img .placeholder { font-family: var(--font-head); font-size: 2.4rem; color: var(--gold); opacity: 0.6; }
.badge { position: absolute; top: 10px; left: 10px; background: var(--gold-grad); color: #111; font-size: 0.72rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
.badge.out { background: #444; color: #eee; left: auto; right: 10px; }
.card-body { padding: 1.1rem 1.2rem 1.3rem; display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
.card-body p { color: var(--text-muted); font-size: 0.92rem; flex: 1; }
.price { display: flex; align-items: baseline; gap: 0.5rem; font-weight: 700; color: var(--gold-light); font-size: 1.15rem; }
.price s { color: #777; font-weight: 400; font-size: 0.9rem; }
.stock { font-size: 0.82rem; }
.stock.in { color: var(--success); }
.stock.out { color: var(--danger); }
.card-actions { display: flex; gap: 0.5rem; margin-top: 0.4rem; }
.card-actions .btn { flex: 1; }

/* Feature / about / faq / reviews */
.feature { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.6rem; text-align: center; }
.feature .icon { font-size: 2rem; margin-bottom: 0.6rem; }
.feature p { color: var(--text-muted); font-size: 0.95rem; }
.review { background: var(--bg-2); border-left: 3px solid var(--gold); border-radius: var(--radius); padding: 1.4rem; }
.review .stars { color: var(--gold-light); letter-spacing: 2px; }
.review p { color: var(--text-muted); margin: 0.5rem 0; }
.review small { color: var(--gold); }
details.faq { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.3rem; margin-bottom: 0.8rem; }
details.faq summary { cursor: pointer; font-weight: 600; color: var(--gold-light); }
details.faq p { color: var(--text-muted); margin-top: 0.6rem; }
.split { display: grid; gap: 2rem; grid-template-columns: 1fr; align-items: center; }
@media (min-width: 860px) { .split { grid-template-columns: 1fr 1fr; } }

/* Forms */
.form-group { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 1rem; }
label { font-size: 0.9rem; color: var(--text-muted); }
input, select, textarea {
  font: inherit; color: var(--text); background: #0c0c0c;
  border: 1px solid #333; border-radius: 10px; padding: 0.7rem 0.9rem; width: 100%;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201, 162, 74, 0.2); }
textarea { min-height: 110px; resize: vertical; }
.field-error { color: var(--danger); font-size: 0.82rem; min-height: 1em; }
.invalid { border-color: var(--danger) !important; }
.form-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.6rem; max-width: 640px; margin: 0 auto; }
.newsletter { display: flex; gap: 0.6rem; max-width: 520px; margin: 0 auto; flex-wrap: wrap; }
.newsletter input { flex: 1; min-width: 200px; }

/* Shop */
.page-hero { text-align: center; padding: 3rem 1.2rem 1.5rem; background: linear-gradient(180deg, #111, var(--bg)); border-bottom: 1px solid var(--border); }
.toolbar { display: grid; gap: 0.8rem; grid-template-columns: 1fr; margin-bottom: 1.5rem; }
@media (min-width: 760px) { .toolbar { grid-template-columns: 2fr 1fr 1fr 1fr; } }
.toolbar input, .toolbar select { background: var(--bg-2); }
.chips { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
.chip { background: var(--bg-2); border: 1px solid #333; color: var(--text-muted); padding: 0.4rem 0.9rem; border-radius: 999px; cursor: pointer; font: inherit; font-size: 0.88rem; }
.chip.active, .chip:hover { border-color: var(--gold); color: var(--gold-light); }
.empty { text-align: center; color: var(--text-muted); padding: 3rem 0; }
.breadcrumbs { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.2rem; }
.breadcrumbs a { color: var(--text-muted); }
.product-detail { display: grid; gap: 2rem; grid-template-columns: 1fr; }
@media (min-width: 860px) { .product-detail { grid-template-columns: 1fr 1fr; } }
.product-detail .card-img { aspect-ratio: 1 / 1; border-radius: var(--radius); border: 1px solid var(--border); }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
.qty button { background: var(--bg-3); color: var(--gold); border: none; width: 38px; height: 38px; font-size: 1.1rem; cursor: pointer; }
.qty span { min-width: 42px; text-align: center; }
.spec-list { list-style: none; color: var(--text-muted); margin: 1rem 0; }
.spec-list li { padding: 0.35rem 0; border-bottom: 1px solid #222; }

/* Cart & checkout */
.cart-layout { display: grid; gap: 2rem; grid-template-columns: 1fr; }
@media (min-width: 900px) { .cart-layout { grid-template-columns: 2fr 1fr; } }
.cart-item { display: grid; grid-template-columns: 70px 1fr auto; gap: 1rem; align-items: center; padding: 1rem 0; border-bottom: 1px solid #222; }
.cart-item .thumb { width: 70px; height: 70px; border-radius: 10px; background: #0d0d0d; display: flex; align-items: center; justify-content: center; color: var(--gold); overflow: hidden; }
.cart-item .thumb img { width: 100%; height: 100%; object-fit: cover; }
.summary { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.4rem; height: fit-content; }
.summary .row { display: flex; justify-content: space-between; padding: 0.4rem 0; color: var(--text-muted); }
.summary .row.total { color: var(--gold-light); font-weight: 700; font-size: 1.15rem; border-top: 1px solid var(--border); margin-top: 0.5rem; padding-top: 0.8rem; }
.coupon-row { display: flex; gap: 0.5rem; margin: 0.8rem 0; }
.pay-options { display: grid; gap: 0.6rem; margin-bottom: 1rem; }
.pay-option { display: flex; align-items: center; gap: 0.7rem; border: 1px solid #333; border-radius: 10px; padding: 0.7rem 0.9rem; cursor: pointer; }
.pay-option:has(input:checked) { border-color: var(--gold); background: rgba(201, 162, 74, 0.08); }
.pay-option input { width: auto; }
.pay-option small { color: var(--text-muted); display: block; }
.notice { border: 1px solid var(--border); background: var(--bg-3); border-radius: 10px; padding: 0.8rem 1rem; font-size: 0.9rem; color: var(--text-muted); margin: 1rem 0; }

/* Toast */
.toast-wrap { position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 0.5rem; align-items: center; }
.toast { background: var(--bg-3); border: 1px solid var(--gold); color: var(--text); padding: 0.7rem 1.2rem; border-radius: 10px; box-shadow: var(--shadow); animation: fadeUp 0.3s ease both; max-width: 90vw; }
.toast.error { border-color: var(--danger); }
.toast.success { border-color: var(--success); }

/* Footer */
.site-footer { background: #000; border-top: 1px solid var(--border); padding: 3rem 1.2rem 1.5rem; }
.footer-grid { display: grid; gap: 2rem; grid-template-columns: 1fr; max-width: 1200px; margin: 0 auto; }
@media (min-width: 760px) { .footer-grid { grid-template-columns: 2fr 1fr 1fr 1fr; } }
.site-footer h4 { color: var(--gold-light); margin-bottom: 0.7rem; font-family: var(--font-head); }
.site-footer ul { list-style: none; }
.site-footer li { margin-bottom: 0.4rem; }
.site-footer a { color: var(--text-muted); }
.site-footer a:hover { color: var(--gold); }
.copy { text-align: center; color: #666; font-size: 0.85rem; margin-top: 2rem; border-top: 1px solid #1a1a1a; padding-top: 1rem; }

/* Floating WhatsApp / lang */
.lang-switch select { width: auto; padding: 0.35rem 0.6rem; border-radius: 999px; background: var(--bg-2); }
.lang-switch { display: flex; align-items: center; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>

  <style>

.admin-main { padding: 1.5rem; min-width: 0; }

.admin-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
.admin-head h1 { font-size: 1.8rem; color: var(--gold-light); }

.stats { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-bottom: 1.5rem; }
.stat { background: linear-gradient(180deg, var(--bg-3), var(--bg-2)); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.2rem; box-shadow: var(--shadow); }
.stat .label { color: var(--text-muted); font-size: .85rem; }
.stat .value { font-size: 1.8rem; font-weight: 700; color: var(--gold-light); font-family: var(--font-head); }

.panel { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.2rem; margin-bottom: 1.5rem; }

.two-col { display: grid; gap: 1.5rem; grid-template-columns: 1fr; }

th, td { text-align: left; padding: .65rem .8rem; border-bottom: 1px solid #222; vertical-align: top; }
th { color: var(--gold); font-weight: 600; background: #0d0d0d; white-space: nowrap; }
tr:hover td { background: #111; }

.toolbar-row { display: flex; gap: .6rem; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
.toolbar-row input, .toolbar-row select { width: auto; min-width: 180px; background: var(--bg-2); }

  <script>
/* =========================================================
   NAJEM DIGITAL — core: storage, cart, i18n, currency, layout
   Data lives in the browser (localStorage) in demo mode.
   See README.md for the Supabase option (real database + login).
   ========================================================= */
(function () {
  const KEY = "najem-digital:v1";

  /* ---------- Storage ---------- */
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function loadDB() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { console.warn("Could not read saved data", e); }
    return clone(window.NAJEM_DEFAULTS);
  }

  let db = loadDB();

  function saveDB() {
    try { localStorage.setItem(KEY, JSON.stringify(db)); return true; }
    catch (e) { toast("Could not save data (storage full or blocked).", "error"); return false; }
  }

  const Store = {
    get db() { return db; },
    save: saveDB,
    reset() { db = clone(window.NAJEM_DEFAULTS); saveDB(); },
    products() { return db.products; },
    product(id) { return db.products.find(p => p.id === id || p.slug === id); },
    categories() { return db.categories; },
    category(id) { return db.categories.find(c => c.id === id); },
    settings() { return db.settings; },
    reviewsApproved(productId) {
      return db.reviews.filter(r => r.status === "approved" && (!productId || r.productId === productId));
    }
  };
  window.NajemStore = Store;

  /* ---------- Helpers ---------- */
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function uid(prefix) { return prefix + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  /* ---------- i18n ---------- */
  let lang = localStorage.getItem("najem-lang") || db.settings.defaultLang || "en";
  function t(key) {
    const dict = window.NAJEM_I18N[lang] || window.NAJEM_I18N.en;
    return dict[key] || window.NAJEM_I18N.en[key] || key;
  }
  function setLang(l) {
    lang = l; localStorage.setItem("najem-lang", l);
    document.documentElement.lang = l;
    location.reload();
  }
  function getLang() { return lang; }

  /* ---------- Currency ---------- */
  function money(amount) {
    const cur = db.settings.currency || "EUR";
    const locale = lang === "fr" ? "fr-FR" : "en-US";
    try {
      if (cur === "MAD") return new Intl.NumberFormat(locale, { style: "currency", currency: "MAD", maximumFractionDigits: 2 }).format(amount);
      return new Intl.NumberFormat(locale, { style: "currency", currency: cur }).format(amount);
    } catch (e) { return amount.toFixed(2) + " " + cur; }
  }

  /* ---------- Toast ---------- */
  function toast(msg, type) {
    let wrap = document.querySelector(".toast-wrap");
    if (!wrap) { wrap = document.createElement("div"); wrap.className = "toast-wrap"; wrap.setAttribute("role", "status"); wrap.setAttribute("aria-live", "polite"); document.body.appendChild(wrap); }
    const el = document.createElement("div");
    el.className = "toast " + (type || "");
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(() => el.remove(), 3200);
  }

  /* ---------- Cart (stored separately from products) ---------- */
  const CART_KEY = "najem-cart";
  function readCart() { try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; } catch (e) { return []; } }
  function writeCart(c) { localStorage.setItem(CART_KEY, JSON.stringify(c)); updateCartBadge(); document.dispatchEvent(new Event("cart:changed")); }

  const Cart = {
    items() { return readCart().filter(i => Store.product(i.id)); },
    add(id, qty) {
      const p = Store.product(id);
      if (!p) return toast("Product not found.", "error");
      if (p.stock === 0) return toast(t("outOfStock"), "error");
      const c = readCart();
      const found = c.find(i => i.id === id);
      const want = (found ? found.qty : 0) + (qty || 1);
      const max = p.stock == null ? 99 : Math.min(p.stock, 99);
      if (want > max) return toast("Only " + max + " available.", "error");
      if (found) found.qty = want; else c.push({ id, qty: qty || 1 });
      writeCart(c);
      toast(t("addedToCart") + " — " + p.name, "success");
    },
    setQty(id, qty) {
      const c = readCart();
      const it = c.find(i => i.id === id);
      if (!it) return;
      const p = Store.product(id);
      const max = p && p.stock != null ? Math.min(p.stock, 99) : 99;
      it.qty = Math.max(1, Math.min(qty, max));
      writeCart(c);
    },
    remove(id) { writeCart(readCart().filter(i => i.id !== id)); },
    clear() { writeCart([]); },
    count() { return this.items().reduce((n, i) => n + i.qty, 0); },
    subtotal() {
      return this.items().reduce((sum, i) => {
        const p = Store.product(i.id);
        const unit = p.salePrice != null ? p.salePrice : p.price;
        return sum + unit * i.qty;
      }, 0);
    }
  };
  window.NajemCart = Cart;

  function updateCartBadge() {
    document.querySelectorAll("[data-cart-count]").forEach(el => el.textContent = Cart.count());
  }

  /* ---------- Layout: header, footer, WhatsApp button ---------- */
  // Current route name, e.g. "shop" for #/shop (set by the router in pages.js)
  function currentRoute() {
    const raw = location.hash.replace(/^#\/?/, "").split("?")[0];
    return raw.split("/")[0] || "home";
  }

  function renderLayout() {
    const s = db.settings;
    const route = currentRoute();
    const navItem = (href, label, name) => `<li><a href="${href}" ${route === name ? 'class="active" aria-current="page"' : ""}>${label}</a></li>`;

    const header = document.getElementById("site-header");
    if (header) {
      header.innerHTML = `
        <div class="nav-wrap">
          <a class="brand" href="#/" aria-label="${escapeHtml(s.storeName)} home">
            <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAgMTIwIiByb2xlPSJpbWciIGFyaWEtbGFiZWw9Ik5BSkVNIERJR0lUQUwgbG9nbyI+CiAgPGRlZnM+CiAgICA8bGluZWFyR3JhZGllbnQgaWQ9ImdvbGQiIHgxPSIwIiB5MT0iMCIgeDI9IjEiIHkyPSIxIj4KICAgICAgPHN0b3Agb2Zmc2V0PSIwJSIgc3RvcC1jb2xvcj0iI2Y1ZGM4YSIvPgogICAgICA8c3RvcCBvZmZzZXQ9IjUwJSIgc3RvcC1jb2xvcj0iI2M5YTI0YSIvPgogICAgICA8c3RvcCBvZmZzZXQ9IjEwMCUiIHN0b3AtY29sb3I9IiM4YTZhMjUiLz4KICAgIDwvbGluZWFyR3JhZGllbnQ+CiAgPC9kZWZzPgogIDxyZWN0IHg9IjIiIHk9IjIiIHdpZHRoPSIxMTYiIGhlaWdodD0iMTE2IiByeD0iMjIiIGZpbGw9IiMwYTBhMGEiIHN0cm9rZT0idXJsKCNnb2xkKSIgc3Ryb2tlLXdpZHRoPSIzIi8+CiAgPHRleHQgeD0iNjAiIHk9Ijc4IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LWZhbWlseT0iR2VvcmdpYSwgJ1RpbWVzIE5ldyBSb21hbicsIHNlcmlmIiBmb250LXNpemU9IjU2IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSJ1cmwoI2dvbGQpIiBsZXR0ZXItc3BhY2luZz0iLTIiPk5EPC90ZXh0PgogIDxsaW5lIHgxPSIyOCIgeTE9IjkwIiB4Mj0iOTIiIHkyPSI5MCIgc3Ryb2tlPSJ1cmwoI2dvbGQpIiBzdHJva2Utd2lkdGg9IjIiLz4KPC9zdmc+Cg==" alt="${escapeHtml(s.storeName)} logo" width="42" height="42">
            <span>${escapeHtml(s.storeName)}</span>
          </a>
          <button class="menu-toggle" aria-label="Menu" aria-expanded="false" aria-controls="main-nav">☰</button>
          <nav aria-label="Main">
            <ul class="nav-links" id="main-nav">
              ${navItem("#/", t("home"), "home")}
              ${navItem("#/shop", t("shop"), "shop")}
              ${navItem("#/home/services", t("services"), "home")}
              ${navItem("#/home/about", t("about"), "home")}
              ${navItem("#/home/contact", t("contact"), "home")}
              <li><a href="#/admin">${t("login")}</a></li>
            </ul>
          </nav>
          <div class="nav-actions">
            <div class="lang-switch">
              <label class="sr-only" for="lang-select">Language</label>
              <select id="lang-select">
                <option value="en" ${lang === "en" ? "selected" : ""}>EN</option>
                <option value="fr" ${lang === "fr" ? "selected" : ""}>FR</option>
              </select>
            </div>
            <a class="cart-btn" href="#/cart" aria-label="${t("cart")}">🛒 ${t("cart")} <span class="cart-count" data-cart-count>0</span></a>
          </div>
        </div>`;

      const toggle = header.querySelector(".menu-toggle");
      const nav = header.querySelector("#main-nav");
      toggle.addEventListener("click", () => {
        const open = nav.classList.toggle("open");
        toggle.setAttribute("aria-expanded", String(open));
      });
      header.querySelector("#lang-select").addEventListener("change", e => setLang(e.target.value));
      nav.addEventListener("click", e => { if (e.target.closest("a")) { nav.classList.remove("open"); toggle.setAttribute("aria-expanded", "false"); } });
    }

    const footer = document.getElementById("site-footer");
    if (footer) {
      const wa = (s.whatsapp || "").replace(/\D/g, "");
      footer.innerHTML = `
        <div class="footer-grid">
          <div>
            <h4 class="gold-text">${escapeHtml(s.storeName)}</h4>
            <p style="color:var(--text-muted)">${escapeHtml(s.deliveryNote)}</p>
          </div>
          <div>
            <h4>${t("shop")}</h4>
            <ul><li><a href="#/shop">${t("shop")}</a></li><li><a href="#/home/services">${t("services")}</a></li><li><a href="#/cart">${t("cart")}</a></li></ul>
          </div>
          <div>
            <h4>${t("contact")}</h4>
            <ul>
              <li><a href="mailto:${escapeHtml(s.email)}">${escapeHtml(s.email)}</a></li>
              <li><a href="tel:${escapeHtml(s.phone)}">${escapeHtml(s.phone)}</a></li>
              ${wa ? `<li><a href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp</a></li>` : ""}

              ${["instagram", "tiktok", "facebook", "x"].filter(k => s.social[k]).map(k => `<a href="${escapeHtml(s.social[k])}" target="_blank" rel="noopener" aria-label="${k}">${k}</a>`).join("")}
            </div>
          </div>
        </div>
        <div class="copy">© ${new Date().getFullYear()} ${escapeHtml(s.storeName)}. ${t("footerRights")}</div>`;
    }

    // Floating WhatsApp button (stays visible while scrolling). Not shown in admin.
    const wa = (s.whatsapp || "").replace(/\D/g, "");
    if (wa && !document.querySelector(".wa-float") && !document.body.classList.contains("admin-body")) {
      const a = document.createElement("a");
      a.className = "wa-float";
      a.href = "https://wa.me/" + wa;
      a.target = "_blank";

      a.setAttribute("aria-label", t("whatsappChat"));
      a.title = t("whatsappChat");

      document.body.appendChild(a);
    }

    updateCartBadge();
  }

  // Mobile nav / cart update hooks
  document.addEventListener("cart:changed", updateCartBadge);

  window.NajemCore = { t, money, toast, escapeHtml, uid, setLang, getLang, renderLayout, saveDB, updateCartBadge, currentRoute };

  document.addEventListener("DOMContentLoaded", () => {
    document.documentElement.lang = lang;
    renderLayout();
  });
  // Re-draw the header when the route changes, so the active link updates
  window.addEventListener("hashchange", () => { renderLayout(); });
})();

/* =========================================================
   NAJEM DIGITAL — public pages: home, shop, product, cart, checkout
   ========================================================= */
(function () {
  const { t, money, toast, escapeHtml: esc, uid } = window.NajemCore;
  const Store = window.NajemStore;
  const Cart = window.NajemCart;

  const isValidEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);

  /* ---------- Product card (shared) ---------- */
  function stockBadge(p) {
    return p.stock === 0
      ? `<span class="stock out">● ${t("outOfStock")}</span>`
      : `<span class="stock in">● ${t("inStock")}</span>`;
  }
  function priceHtml(p) {
    if (p.salePrice != null && p.salePrice < p.price) {
      return `<span class="price">${money(p.salePrice)} <s>${money(p.price)}</s></span>`;
    }
    return `<span class="price">${money(p.price)}</span>`;
  }
  function imageHtml(p) {
    if (p.image) return `<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">`;
    const letter = (p.name || "N").trim().charAt(0).toUpperCase();
    return `<div class="placeholder" aria-hidden="true">${esc(letter)}</div>`;
  }
  function productCard(p) {
    const cat = Store.category(p.categoryId);
    const badges = [];
    if (p.salePrice != null && p.salePrice < p.price) badges.push(`<span class="badge">−${Math.round((1 - p.salePrice / p.price) * 100)}%</span>`);
    if (p.stock === 0) badges.push(`<span class="badge out">${t("outOfStock")}</span>`);
    return `
      <article class="card">
        <a class="card-img" href="#/product?id=${encodeURIComponent(p.id)}" tabindex="-1" aria-hidden="true">
          ${imageHtml(p)}${badges.join("")}
        </a>
        <div class="card-body">
          <small style="color:var(--gold)">${esc(cat ? cat.name : "")}</small>
          <h3><a href="#/product?id=${encodeURIComponent(p.id)}" style="color:var(--text)">${esc(p.name)}</a></h3>
          <p>${esc(p.description)}</p>
          ${priceHtml(p)}
          ${stockBadge(p)}
          <div class="card-actions">
            <a class="btn btn-outline btn-small" href="#/product?id=${encodeURIComponent(p.id)}">${t("viewDetails")}</a>
            <button class="btn btn-small" data-add="${esc(p.id)}" ${p.stock === 0 ? "disabled" : ""}>${t("addToCart")}</button>
          </div>
        </div>
      </article>`;
  }
  // Event delegation for add-to-cart buttons on any page

  /* ---------- HOME ---------- */
  function initHome() {
    const s = Store.settings();
    const wa = (s.whatsapp || "").replace(/\D/g, "");
    const setAttr = (id, attr, val) => { const el = document.getElementById(id); if (el) el[attr] = val; };
    setAttr("c-email-link", "href", "mailto:" + s.email);
    setAttr("c-email-link", "textContent", s.email);
    setAttr("c-phone-link", "href", "tel:" + s.phone);
    setAttr("c-phone-link", "textContent", s.phone);
    if (wa) setAttr("c-wa-link", "href", "https://wa.me/" + wa);
    document.querySelectorAll("#view [data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
    const products = Store.products();
    const sorted = products.slice();
    const featured = products.filter(p => p.featured).slice(0, 4);
    const best = products.slice().sort((a, b) => b.sales - a.sales).slice(0, 4);
    const newest = products.slice(-4).reverse();
    const offers = products.filter(p => p.salePrice != null && p.salePrice < p.price).slice(0, 4);

    const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
    const grid = list => list.length ? list.map(productCard).join("") : `<p class="empty" style="grid-column:1/-1">${t("noResults")}</p>`;

    set("hero-title", t("heroTitle"));
    set("hero-sub", t("heroSub"));
    set("featured-grid", grid(featured));
    set("best-grid", grid(best));
    set("new-grid", grid(newest));
    set("offers-grid", grid(offers));
    void sorted;

    // Social services list (category slug "social-media")
    const socialCat = Store.categories().find(c => c.slug === "social-media");
    const services = products.filter(p => socialCat && p.categoryId === socialCat.id);
    set("services-grid", services.map(p => `
      <article class="card">
        <div class="card-img"><div class="placeholder" aria-hidden="true">${esc(p.name.charAt(0))}</div></div>
        <div class="card-body">
          <h3>${esc(p.name)}</h3>
          <p>${esc(p.description)}</p>
          <p style="font-size:.85rem">🚚 ${esc(s.deliveryNote)}</p>
          ${priceHtml(p)}
          <div class="card-actions">
            <a class="btn btn-outline btn-small" href="#/product?id=${encodeURIComponent(p.id)}">${t("viewDetails")}</a>
            <button class="btn btn-small" data-add="${esc(p.id)}">${t("addToCart")}</button>
          </div>
        </div>
      </article>`).join("") || `<p class="empty" style="grid-column:1/-1">${t("noResults")}</p>`);

    // Reviews
    set("reviews-grid", Store.reviewsApproved().map(r => `
      <div class="review">
        <div class="stars" aria-label="${r.rating} out of 5">${"★".repeat(r.rating)}${"☆".repeat(5 - r.rating)}</div>
        <p>${esc(r.text)}</p>
        <small>— ${esc(r.name)}</small>
      </div>`).join("") || `<p class="empty">—</p>`);

    // Reviews form
    const rf = document.getElementById("review-form");
    if (rf) rf.addEventListener("submit", e => {
      e.preventDefault();
      const f = new FormData(rf);
      const name = String(f.get("name") || "").trim();
      const text = String(f.get("text") || "").trim();
      if (name.length < 2 || text.length < 5) return toast(t("reqField"), "error");
      Store.db.reviews.push({ id: uid("r"), name, rating: Number(f.get("rating")) || 5, text, status: "pending", productId: "", date: new Date().toISOString().slice(0, 10) });
      Store.save();
      rf.reset();
      toast("Thanks — your review will appear after moderation.", "success");
    });

    // Newsletter
    const nf = document.getElementById("newsletter-form");
    if (nf) nf.addEventListener("submit", e => {
      e.preventDefault();
      const email = nf.querySelector("input[type=email]").value.trim();
      if (!isValidEmail(email)) return toast(t("badEmail"), "error");
      Store.db.subscribers = Store.db.subscribers || [];
      if (!Store.db.subscribers.includes(email)) Store.db.subscribers.push(email);
      Store.save();
      nf.reset();
      toast(t("newsletterOk"), "success");
    });

    // Contact form (saved to the admin inbox)
    const cf = document.getElementById("contact-form");
    if (cf) cf.addEventListener("submit", e => {
      e.preventDefault();
      const f = new FormData(cf);
      const name = String(f.get("name") || "").trim();
      const email = String(f.get("email") || "").trim();
      const message = String(f.get("message") || "").trim();
      let ok = true;
      cf.querySelectorAll("input,textarea").forEach(el => el.classList.remove("invalid"));
      if (name.length < 2) { ok = false; cf.name.classList.add("invalid"); }
      if (!isValidEmail(email)) { ok = false; cf.email.classList.add("invalid"); }
      if (message.length < 5) { ok = false; cf.message.classList.add("invalid"); }
      if (!ok) return toast(t("reqField"), "error");
      Store.db.messages = Store.db.messages || [];
      Store.db.messages.push({ id: uid("m"), name, email, message, date: new Date().toISOString() });
      Store.save();
      cf.reset();
      toast(t("contactOk"), "success");
    });

    // Order tracking
    const tf = document.getElementById("track-form");
    if (tf) tf.addEventListener("submit", e => {
      e.preventDefault();
      const id = tf.orderId.value.trim().toUpperCase();
      const email = tf.email.value.trim().toLowerCase();
      const o = Store.db.orders.find(x => x.id === id && x.email.toLowerCase() === email);
      const out = document.getElementById("track-result");
      out.innerHTML = o
        ? `<div class="notice"><strong>${esc(o.id)}</strong> — payment: <b>${esc(o.paymentStatus)}</b> · delivery: <b>${esc(o.deliveryStatus)}</b>${o.deliveryNote ? "<br>" + esc(o.deliveryNote) : ""}</div>`
        : `<div class="notice">${t("trackOrder")}: not found.</div>`;
    });
  }

  /* ---------- SHOP ---------- */
  function initShop() {
    const grid = document.getElementById("shop-grid");
    const search = document.getElementById("f-search");
    const catSel = document.getElementById("f-cat");
    const sortSel = document.getElementById("f-sort");
    const minI = document.getElementById("f-min");
    const maxI = document.getElementById("f-max");
    const chips = document.getElementById("cat-chips");
    const count = document.getElementById("result-count");

    // Fill translatable labels
    search.placeholder = t("search");
    sortSel.innerHTML = `
      <option value="featured">${t("sortDefault")}</option>
      <option value="price-asc">${t("sortPriceAsc")}</option>
      <option value="price-desc">${t("sortPriceDesc")}</option>
      <option value="popular">${t("sortPopular")}</option>`;
    catSel.innerHTML = `<option value="">${t("allCategories")}</option>` +
      Store.categories().map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");
    minI.placeholder = t("minPrice"); maxI.placeholder = t("maxPrice");

    const params = new URLSearchParams(location.search);
    if (params.get("cat")) catSel.value = params.get("cat");
    if (params.get("q")) search.value = params.get("q");

    chips.innerHTML = `<button class="chip active" data-cat="">${t("allCategories")}</button>` +
      Store.categories().map(c => `<button class="chip" data-cat="${esc(c.id)}">${esc(c.name)}</button>`).join("");

    function render() {
      const q = search.value.trim().toLowerCase();
      const cat = catSel.value;
      const min = parseFloat(minI.value);
      const max = parseFloat(maxI.value);
      let list = Store.products().filter(p => {
        const price = p.salePrice != null ? p.salePrice : p.price;
        if (cat && p.categoryId !== cat) return false;
        if (!isNaN(min) && price < min) return false;
        if (!isNaN(max) && price > max) return false;
        if (q && !(p.name + " " + p.description + " " + (p.tags || []).join(" ")).toLowerCase().includes(q)) return false;
        return true;
      });
      const priceOf = p => (p.salePrice != null ? p.salePrice : p.price);
      switch (sortSel.value) {
        case "price-asc": list.sort((a, b) => priceOf(a) - priceOf(b)); break;
        case "price-desc": list.sort((a, b) => priceOf(b) - priceOf(a)); break;
        case "popular": list.sort((a, b) => b.sales - a.sales); break;
      }
      grid.innerHTML = list.length ? list.map(productCard).join("") : `<p class="empty" style="grid-column:1/-1">${t("noResults")}</p>`;
      count.textContent = list.length + " / " + Store.products().length;
      chips.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c.dataset.cat === catSel.value));
    }

    [search, catSel, sortSel, minI, maxI].forEach(el => el.addEventListener("input", render));
    chips.addEventListener("click", e => {
      const b = e.target.closest(".chip");
      if (!b) return;
      catSel.value = b.dataset.cat;
      render();
    });
    render();
  }

      <nav class="breadcrumbs" aria-label="Breadcrumb">

          <h1 style="font-size:2.2rem">${esc(p.name)}</h1>
          <div style="margin:.8rem 0">${priceHtml(p)}</div>
          ${stockBadge(p)}
          <p style="color:var(--text-muted);margin:1rem 0">${esc(p.description)}</p>
          <ul class="spec-list">
            <li>Type: ${p.type === "service" ? "Service (delivered by our team)" : "Digital download / access"}</li>
            <li>${t("delivery")}: ${esc(s.deliveryNote)}</li>
          </ul>
          <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin:1rem 0">
            <div class="qty" aria-label="Quantity">
              <button type="button" id="q-minus" aria-label="Decrease">−</button>
              <span id="q-val" aria-live="polite">1</span>
              <button type="button" id="q-plus" aria-label="Increase">+</button>
            </div>
            <button class="btn" id="add-btn" ${p.stock === 0 ? "disabled" : ""}>${t("addToCart")}</button>
            <button class="btn btn-outline" id="buy-btn" type="button" ${p.stock === 0 ? "disabled" : ""}>${t("checkout")}</button>
          </div>
          <h2 style="font-size:1.4rem;margin-top:2rem">${t("reviewsTitle")}</h2>

        </div>

    document.getElementById("q-plus").onclick = () => { qty = Math.min(max || 1, qty + 1); qv.textContent = qty; };
    document.getElementById("add-btn").onclick = () => Cart.add(p.id, qty);
    document.getElementById("buy-btn").onclick = () => { Cart.add(p.id, qty); location.hash = "#/checkout"; };
